name: Не забываем отписываться кого не будет!

on: 
  workflow_dispatch: # Для ручного теста

jobs:
  send-third:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Message
        env:
          DISCORD_WEBHOOK_THIRD: ${{ secrets.DISCORD_WEBHOOK_THIRD }}
        run: python3 send_third.py
