name: Ежедневный сбор в Discord

on:
  schedule:
    # 19:30, 19:35, 19:40, 19:45 МСК = 16:30, 16:35, 16:40, 16:45 UTC (Чт, Пт, Сб)
    - cron: '30,35,40,45 16 * * 4,5,6'
    # 20:25 МСК = 17:25 UTC (Вс, Пн, Вт, Ср)
    - cron: '25 17 * * 0,1,2,3'
  workflow_dispatch: # Позволяет запустить вручную для теста

jobs:
  send-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord messages
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 send_discord.py
