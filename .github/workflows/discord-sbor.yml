name: Ежедневный сбор в Discord

on:
  schedule:
    # 19:33, 19:38, 19:43, 19:48 МСК = 16:33, 16:38, 16:43, 16:48 UTC (Чт, Пт, Сб)
    - cron: '33,38,43,48 16 * * 4,5,6'
    # 20:28 МСК = 17:28 UTC (Вс, Пн, Вт, Ср)
    - cron: '28 17 * * 0,1,2,3'
  workflow_dispatch: # Позволяет запустить вручную для теста

jobs:
  send-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord messages
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 send_discord.py
